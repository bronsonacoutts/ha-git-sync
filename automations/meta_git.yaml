# Maintenance / Git-related automations
# Loaded by Home Assistant via: automation: !include_dir_merge_list automations/
# See configuration.yaml.example for the required configuration.yaml entry.
#
# Each automation has a stable, unique id so it remains editable from the
# Home Assistant UI and can also be edited directly in this file on GitHub.
# Do not remove or change the id values — HA uses them to track automations
# across restarts and UI edits.

- alias: "[Maintenance] Git Pull on GitHub Webhook"
  id: 'maintenance_git_pull_on_github_webhook'
  description: "Pulls latest config from GitHub when notify-ha.yml fires. Source must be github-actions."
  trigger:
  - platform: webhook
    webhook_id: !secret git_sync_webhook_id
    allowed_methods:
      - POST
    local_only: false
  condition:
  - condition: template
    value_template: "{{ trigger.json.source | default('') == 'github-actions' }}"
  action:
  - action: shell_command.git_pull
    response_variable: pull_result
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ pull_result.return_code == 0 }}"
      sequence:
      - action: persistent_notification.create
        data:
          title: "✅ Git Sync"
          message: "Config pulled from GitHub successfully ({{ trigger.json.sha[:7] | default('unknown') }})."
    default:
    - action: persistent_notification.create
      data:
        title: "❌ Git Sync Failed"
        message: "Git pull failed (exit {{ pull_result.return_code }}). Check HA logs."
  mode: single

- alias: "[Maintenance] Push Git Config After UI-backed Changes"
  id: '1767773315131'
  description: "Tags: Maintenance, Git, Push, UI - Debounced publish after dashboard or YAML reload activity initiated from the HA UI."
  trigger:
  - platform: event
    event_type: lovelace_updated
  - platform: event
    event_type: call_service
    event_data:
      domain: automation
      service: reload
  - platform: event
    event_type: call_service
    event_data:
      domain: script
      service: reload
  - platform: event
    event_type: call_service
    event_data:
      domain: scene
      service: reload
  - platform: event
    event_type: call_service
    event_data:
      domain: homeassistant
      service: reload_core_config
  condition:
  - condition: template
    value_template: >-
      {{ trigger.event.event_type == 'lovelace_updated'
         or trigger.event.context.user_id is not none }}
  action:
  - action: script.maintenance_git_push_config
  mode: single

- alias: "[Maintenance] Reload Automations After Git Sync"
  id: '1767772677262'
  description: "Reload automations after the git sync script (pull + push) completes."
  trigger:
  - platform: state
    entity_id: script.maintenance_git_sync_config
    from: "on"
    to: "off"
  condition: []
  action:
  - action: automation.reload
    data: {}
  mode: single

- alias: "[Maintenance] Nightly Config Backup"
  id: '1772117850002'
  description: "Commit and tag nightly backup at 03:00."
  trigger:
  - platform: time
    at: "03:00:00"
  condition: []
  action:
  - action: shell_command.git_nightly_backup
    response_variable: backup_result
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ backup_result.return_code == 0 }}"
      sequence:
      - action: persistent_notification.create
        data:
          title: "✅ Nightly Backup"
          message: "Nightly config backup completed."
    default:
    - action: persistent_notification.create
      data:
        title: "❌ Nightly Backup Failed"
        message: "Nightly backup failed (exit {{ backup_result.return_code }}). Check HA logs."
  mode: single

- alias: "[Maintenance] Weekly Config Snapshot"
  id: '1772117850003'
  description: "Create tar.gz snapshot every Sunday at 02:30."
  trigger:
  - platform: time
    at: "02:30:00"
  condition:
  - condition: time
    weekday:
    - sun
  action:
  - action: shell_command.git_weekly_snapshot
    response_variable: snap_result
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ snap_result.return_code == 0 }}"
      sequence:
      - action: persistent_notification.create
        data:
          title: "✅ Weekly Snapshot"
          message: "Weekly config snapshot completed."
    default:
    - action: persistent_notification.create
      data:
        title: "❌ Weekly Snapshot Failed"
        message: "Weekly snapshot failed (exit {{ snap_result.return_code }}). Check HA logs."
  mode: single

- alias: "[Maintenance] Monthly Backup Tag Cleanup"
  id: '1772117850004'
  description: "Prune backup/nightly-* tags older than 30 days on the 1st of each month."
  trigger:
  - platform: time
    at: "04:00:00"
  condition:
  - condition: template
    value_template: "{{ now().day == 1 }}"
  action:
  - action: shell_command.git_cleanup_backups
  mode: single

# Webhook-triggered pull: fired by notify-ha.yml GitHub Actions workflow
# on every push/merge to main.
#
# LOOP PREVENTION
# ---------------
# The condition below skips the pull only when the webhook caller explicitly
# sends `source: "home-assistant"` in the JSON payload. The notify-ha.yml
# workflow always sends `source: "github-actions"`, so those pushes are
# allowed through. If you configure HA to POST back to GitHub after a push,
# set source to "home-assistant" in that call so this condition blocks the
# redundant pull and prevents a push→webhook→pull→push loop.
#
# SECRETS REQUIRED
# ----------------
# 1. Add to /config/secrets.yaml:
#      git_sync_webhook_id: "your-unique-webhook-id-here"
#    Generate a strong value:
#      python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# 2. Add HA_WEBHOOK_URL as a GitHub Actions secret in your repo settings:
#      https://<your-ha-url>/api/webhook/<git_sync_webhook_id>
#
# 3. Ensure your HA instance is reachable from the internet
#    (Nabu Casa, Cloudflare Tunnel, or reverse proxy with TLS).
- alias: "[Maintenance] Git Pull on GitHub Webhook"
  id: 'maintenance_git_pull_on_github_webhook'
  description: "Tags: Maintenance, Git, Pull, Webhook — Pulls latest config from GitHub when notify-ha.yml fires. Skips if webhook payload contains source == 'home-assistant' (set that value in any HA-originated webhook call to prevent push→pull loops)."
  trigger:
  - platform: webhook
    webhook_id: !secret git_sync_webhook_id
    allowed_methods:
      - POST
    local_only: false
  condition:
  # Skip the pull only when the caller sends source == 'home-assistant'.
  # Calls from notify-ha.yml carry source == 'github-actions' and pass through.
  - condition: template
    value_template: "{{ trigger.json.source | default('') != 'home-assistant' }}"
  action:
  - action: shell_command.git_pull
  mode: queued
  max: 2
